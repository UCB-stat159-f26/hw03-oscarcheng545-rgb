[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-career-hw3"
version = "0.1.0"
description = "Tennis Abstract career match age comparisons"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pandas>=1.5", "matplotlib>=3.5"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
